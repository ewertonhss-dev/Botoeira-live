<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101216" />
  <meta name="description" content="Botoeira de sons 5x10 com armazenamento local no navegador." />
  <title>Botoeira de Sons</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Botoeira de Sons</h1>
        <p>50 botões • 5 × 10 • sons salvos neste navegador</p>
      </div>
      <button id="stopAll" class="danger secondary" type="button">■ Parar tudo</button>
    </header>

    <section class="statusbar" aria-live="polite">
      <span id="statusDot" class="dot"></span>
      <span id="status">Pronto para tocar.</span>
    </section>

    <section class="board-wrap" aria-label="Botoeira">
      <div id="board" class="board"></div>
    </section>

    <p class="hint">Clique em um botão vazio para configurá-lo. Use ⚙ para editar um botão já configurado.</p>
  </main>

  <dialog id="editor">
    <form id="editorForm" method="dialog">
      <div class="modal-head">
        <div>
          <h2>Configurar botão <span id="slotNumber"></span></h2>
          <p>Escolha um nome e um arquivo de áudio.</p>
        </div>
        <button id="closeEditor" class="icon-btn" type="button" aria-label="Fechar">✕</button>
      </div>

      <label>
        Nome do botão
        <input id="soundName" type="text" maxlength="30" placeholder="Ex.: Buzina" autocomplete="off" />
      </label>

      <label>
        Arquivo de áudio
        <input id="soundFile" type="file" accept="audio/*" />
      </label>

      <div id="fileInfo" class="file-info">Nenhum áudio configurado.</div>
      <div id="editorMessage" class="editor-message" aria-live="polite"></div>

      <div class="actions">
        <button id="saveSound" class="primary" type="button">Salvar</button>
        <button id="testSound" class="secondary" type="button">▶ Testar</button>
        <button id="removeSound" class="secondary danger-text" type="button">Remover áudio</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
